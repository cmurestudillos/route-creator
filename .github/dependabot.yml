version: 2
updates:
  # Dependencias npm/pnpm (lee pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: develop
    groups:
      electron:
        patterns: ["electron", "electron-builder", "@electron/*"]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["electron", "electron-builder", "@electron/*"]
        update-types: [minor, patch]
    ignore:
      # Los saltos de major de Electron se hacen a mano (breaking changes)
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  # Versiones de las GitHub Actions usadas en los workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
