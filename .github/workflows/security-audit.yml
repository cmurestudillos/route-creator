name: Security Audit

on:
  pull_request:
  push:
    branches: [master, develop]
  schedule:
    # Todos los lunes a las 06:00 UTC: detecta CVEs nuevos aunque no haya cambios
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm audit solo necesita el lockfile, no hace falta instalar
      - name: pnpm audit
        run: pnpm audit --audit-level=high
