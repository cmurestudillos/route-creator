allowBuilds:
  electron: true
  electron-winstaller: true

overrides:
  tmp: "^0.2.6"
  yauzl: "^3.3.1"
  form-data: "^4.0.6"
  undici: "^6.29.1"
  fast-uri: "^3.1.9"
  tar: "^7.5.18"
  js-yaml: "^4.3.2"
  "@xmldom/xmldom": "^0.8.15"
  http-cache-semantics: "^4.2.1"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
  "brace-expansion@>=3.0.0": "^5.0.12"
  global-agent: "^4.1.3"

# minimatch < 11.0.1 (GHSA-g3hv-75wg-m249, DoS con patrones maliciosos): sin parche fuera de la v11 y ningún
# dependiente la admite aún (electron-builder, @electron/asar, glob 7, filelist, dir-compare, ESLint); forzarla rompe
# lint y build. Solo se usa en desarrollo con patrones de nuestra configuración y no llega al instalador.
# Esta excepción también oculta el aviso en producción: comprobar que `pnpm why minimatch --prod` sigue vacío.
# Quitarla cuando `pnpm why minimatch` no muestre ninguna versión < 11.0.1. Revisar en 2027-05.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
